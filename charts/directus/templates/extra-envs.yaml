{{- /*
extraEnvVars commonly carry credentials, so they are rendered as a Secret
(not a ConfigMap) and loaded through envFrom.secretRef.
*/ -}}
{{ if .Values.extraEnvVars -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "directus.fullname" . }}-extra-environment-variables
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "directus.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range .Values.extraEnvVars }}
  {{ .name }}: {{ .value | quote }}
{{- end }}
{{- end }}
